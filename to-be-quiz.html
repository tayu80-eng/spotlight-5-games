<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TO BE Challenge</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef7ff,#fff3f8);min-height:100vh;color:#25324a}.app{width:min(760px,92%);margin:35px auto}.header{text-align:center}.top{display:flex;justify-content:space-between;font-weight:bold;margin:18px 0 10px}.progress{height:12px;background:#dde5ef;border-radius:20px;overflow:hidden;margin-bottom:20px}.bar{height:100%;background:linear-gradient(90deg,#7c6cff,#38bdf8);transition:.3s}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 35px #25324a1f}.round{display:inline-block;background:#eef2ff;color:#5b5bd6;padding:7px 13px;border-radius:20px;font-weight:bold}.q{font-size:1.4rem;margin:18px 0}.answers{display:grid;gap:12px}.ans{border:2px solid #e3e8ef;background:white;padding:15px;border-radius:16px;font-size:1.05rem;text-align:left;cursor:pointer}.ans:hover{border-color:#8b83ff}.correct{border-color:#22a06b;background:#eafaf2}.wrong{border-color:#e5484d;background:#fff0f0}.feedback{margin-top:18px;padding:15px;border-radius:14px;display:none;line-height:1.5}.good{display:block;background:#eafaf2}.bad{display:block;background:#fff4e8}.next,.restart{display:none;width:100%;margin-top:18px;border:0;padding:15px;border-radius:16px;color:#fff;font-size:1rem;font-weight:bold;background:linear-gradient(90deg,#7067e8,#3da9fc);cursor:pointer}.result{text-align:center;display:none}.emoji{font-size:4rem}.stars{font-size:2rem}@media(max-width:550px){.card{padding:20px}.q{font-size:1.2rem}}</style></head><body><div class="app"><div class="header"><h1>🚀 TO BE Challenge</h1><p>Present Simple • am / is / are</p></div><div id="quiz"><div class="top"><span id="count"></span><span>⭐ Score: <span id="score">0</span></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="card"><div class="round" id="round"></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next question →</button></div></div><div class="card result" id="result"><div class="emoji" id="emoji"></div><h2 id="title"></h2><h2 id="final"></h2><div class="stars" id="stars"></div><p id="message"></p><button class="restart" id="restart">🔄 Play again</button></div></div><script>const qs=[
['🟢 Choose the correct form','I ___ eleven years old.',['am','is','are'],0,'We use <b>am</b> with <b>I</b>: <i>I am eleven years old.</i>'],
['🟢 Choose the correct form','My best friend ___ very funny.',['am','is','are'],1,'<b>My best friend</b> means one person, so we use <b>is</b>.'],
['🟢 Choose the correct form','We ___ in Year 5.',['is','am','are'],2,'We use <b>are</b> with <b>we</b>: <i>We are in Year 5.</i>'],
['🟢 Choose the correct form','Tom and Ben ___ at school.',['are','is','am'],0,'Tom and Ben = <b>they</b>, so we use <b>are</b>.'],
['🚫 Make it negative','Kate is happy. Choose the correct negative sentence.',['Kate not is happy.','Kate isn\'t happy.','Kate aren\'t happy.'],1,'<b>is not = isn\'t</b>: <i>Kate isn\'t happy.</i>'],
['🚫 Make it negative','We are late. Choose the negative sentence.',['We aren\'t late.','We isn\'t late.','We not are late.'],0,'<b>are not = aren\'t</b>: <i>We aren\'t late.</i>'],
['🚫 Make it negative','Choose the correct sentence.',['I amn\'t tired.','I not am tired.','I\'m not tired.'],2,'With <b>I am</b>, the usual negative form is <b>I\'m not</b>.'],
['❓ Question Detective','Choose the correct question.',['You are twelve?','Are you twelve?','Is you twelve?'],1,'In a question, <b>are</b> comes before <b>you</b>: <i>Are you twelve?</i>'],
['❓ Question Detective','Which question is correct?',['Is your teacher nice?','Are your teacher nice?','Your teacher is nice?'],0,'<b>Your teacher</b> is one person, so the question begins with <b>Is</b>.'],
['❓ Question Detective','Choose the correct question.',['Is they at school?','They are at school?','Are they at school?'],2,'With <b>they</b> we use <b>are</b>: <i>Are they at school?</i>'],
['⚡ Short answers','Are you a student?',['Yes, I am.','Yes, I is.','Yes, I\'m.'],0,'The short answer is <b>Yes, I am.</b> We don\'t say <i>Yes, I\'m.</i>'],
['⚡ Short answers','Is Tom at home? — No, ___.',['he aren\'t','he isn\'t','he not'],1,'<i>Is Tom...?</i> → <b>No, he isn\'t.</b>'],
['🔧 Fix the mistake','I is a good student. Choose the correct sentence.',['I are a good student.','I am a good student.','I be a good student.'],1,'<b>I</b> always goes with <b>am</b>.'],
['🔧 Fix the mistake','Are she your sister? Choose the correct version.',['Is she your sister?','Am she your sister?','She are your sister?'],0,'We use <b>is</b> with <b>she</b>: <i>Is she your sister?</i>'],
['🏆 Final Challenge','Which sentence is completely correct?',['They isn\'t new students.','Are your friends from Russia?','Is you good at English?'],1,'<b>Friends = they</b>, so <i>Are your friends from Russia?</i> is correct.']];let i=0,s=0,done=false;const $=x=>document.getElementById(x);function load(){done=false;let x=qs[i];$('round').innerHTML=x[0];$('q').innerHTML=(i+1)+'. '+x[1];$('count').textContent=`Question ${i+1} / ${qs.length}`;$('bar').style.width=`${i/qs.length*100}%`;$('answers').innerHTML='';$('feedback').style.display='none';$('next').style.display='none';x[2].forEach((a,n)=>{let b=document.createElement('button');b.className='ans';b.innerHTML=`<b>${String.fromCharCode(65+n)})</b> ${a}`;b.onclick=()=>choose(n,b);$('answers').appendChild(b)})}function choose(n,b){if(done)return;done=true;let x=qs[i],bs=document.querySelectorAll('.ans');bs.forEach(z=>z.disabled=true);bs[x[3]].classList.add('correct');let f=$('feedback');if(n===x[3]){s++;$('score').textContent=s;f.className='feedback good';f.innerHTML='✅ <b>Correct!</b><br>'+x[4]}else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML=`💡 <b>Not quite.</b><br>The correct answer is <b>${x[2][x[3]]}</b>.<br>${x[4]}`}f.style.display='block';$('next').style.display='block';$('next').textContent=i===qs.length-1?'See my result 🏆':'Next question →'}$('next').onclick=()=>{i++;i<qs.length?load():finish()};function finish(){$('quiz').style.display='none';$('result').style.display='block';let p=Math.round(s/qs.length*100),e,t,m,st;if(p>=90){e='🏆';t='TO BE Champion!';st='⭐⭐⭐⭐⭐';m='Amazing work! You can use <b>am, is and are</b>, make negatives and questions, and give short answers.'}else if(p>=70){e='🌟';t='Grammar Star!';st='⭐⭐⭐⭐';m='Great job! You understand <b>to be</b> very well. Check the questions you missed and try once more!'}else if(p>=50){e='👍';t='Good job!';st='⭐⭐⭐';m='You’re making good progress! Revise <b>am / is / are</b>, negatives and questions, then play again.'}else{e='🚀';t='Keep going!';st='⭐⭐';m='Remember: <b>I am • he/she/it is • you/we/they are</b>. Read the explanations and try again.'}$('emoji').textContent=e;$('title').textContent=t;$('final').textContent=`${s} / ${qs.length} • ${p}%`;$('stars').textContent=st;$('message').innerHTML=m;$('restart').style.display='block'}$('restart').onclick=()=>{i=0;s=0;$('score').textContent=0;$('result').style.display='none';$('quiz').style.display='block';load()};load();</script></body></html>
