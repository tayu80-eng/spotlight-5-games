<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TO BE Challenge</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#fff1f8,#eef8ff 48%,#fff8df);min-height:100vh;color:#26324b}.app{width:min(820px,94%);margin:24px auto 50px}.header{text-align:center}.header h1{font-size:clamp(2rem,6vw,3.2rem);margin:10px 0 4px}.header p{margin:0 0 15px;color:#65718b;font-weight:700}.top{display:flex;justify-content:space-between;font-weight:800;margin:12px 4px 8px}.progress{height:14px;background:#fff;border-radius:20px;overflow:hidden;margin-bottom:16px;box-shadow:0 3px 12px #40506b18}.bar{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899,#f59e0b);transition:.35s}.card{background:#fff;border-radius:28px;padding:22px;box-shadow:0 14px 38px #33415520;border:1px solid #ffffff}.round{display:inline-block;background:#f0ecff;color:#6552cc;padding:8px 14px;border-radius:20px;font-weight:800}.scene{height:210px;margin:15px 0;border-radius:23px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#bcecff,#e9d5ff)}.scene .sky{position:absolute;inset:0;background:linear-gradient(#aee9ff 0 58%,#bceaa7 58%)}.scene .sun{position:absolute;width:52px;height:52px;border-radius:50%;background:#ffd84d;right:25px;top:20px;box-shadow:0 0 0 10px #fff6a755}.scene .school{position:absolute;bottom:18px;width:180px;height:110px;background:#fff4cf;border:6px solid #fff;border-radius:12px;box-shadow:0 7px 0 #6d5c91}.scene .school:before{content:'SCHOOL';position:absolute;top:12px;left:37px;font-weight:900;color:#6552cc}.scene .school:after{content:'🚪  🪟  🪟';position:absolute;bottom:15px;left:30px;font-size:28px}.people{position:absolute;z-index:2;bottom:15px;left:20px;font-size:74px;filter:drop-shadow(0 6px 2px #0002)}.props{position:absolute;z-index:2;right:20px;bottom:12px;font-size:62px}.bubble{position:absolute;z-index:3;top:18px;left:20px;background:white;padding:10px 14px;border-radius:18px;font-size:18px;font-weight:800;box-shadow:0 5px 12px #0001}.q{font-size:clamp(1.25rem,4vw,1.65rem);font-weight:800;margin:17px 2px}.answers{display:grid;gap:11px}.ans{border:3px solid #edf0f5;background:#fff;padding:15px;border-radius:17px;font-size:1.05rem;text-align:left;cursor:pointer;font-weight:650;box-shadow:0 4px 0 #e6eaf0;transition:.15s}.ans:hover{transform:translateY(-2px);border-color:#9b87f5}.correct{border-color:#22a06b!important;background:#eafaf2!important;box-shadow:0 4px 0 #a7e3c7!important}.wrong{border-color:#e5484d!important;background:#fff0f0!important;box-shadow:0 4px 0 #f2b9bb!important}.feedback{margin-top:16px;padding:14px;border-radius:14px;display:none;line-height:1.5}.good{display:block;background:#eafaf2}.bad{display:block;background:#fff4e8}.next,.restart{display:none;width:100%;margin-top:16px;border:0;padding:15px;border-radius:17px;color:#fff;font-size:1.05rem;font-weight:900;background:linear-gradient(90deg,#7c3aed,#ec4899);cursor:pointer;box-shadow:0 6px 0 #6d28d9}.result{text-align:center;display:none}.emoji{font-size:5rem}.stars{font-size:2.3rem}@media(max-width:550px){.card{padding:16px}.scene{height:175px}.people{font-size:58px}.props{font-size:48px}.school{transform:scale(.82)}}</style></head><body><div class="app"><div class="header"><h1>🚀 TO BE Challenge</h1><p>Look • Think • Choose • Win! ⭐</p></div><div id="quiz"><div class="top"><span id="count"></span><span>⭐ Score: <span id="score">0</span></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="card"><div class="round" id="round"></div><div class="scene"><div class="sky"></div><div class="sun"></div><div class="school"></div><div class="bubble" id="bubble"></div><div class="people" id="people"></div><div class="props" id="props"></div></div><div class="q" id="q"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next question →</button></div></div><div class="card result" id="result"><div class="emoji" id="emoji"></div><h2 id="title"></h2><h2 id="final"></h2><div class="stars" id="stars"></div><p id="message"></p><button class="restart" id="restart">🔄 Play again</button></div></div><script>const qs=[['🟢 Choose the correct form','I ___ eleven years old.',['am','is','are'],0,'We use <b>am</b> with <b>I</b>.','🧒','🎂1️⃣1️⃣','Hi! I am…'],['🟢 Choose the correct form','My best friend ___ very funny.',['am','is','are'],1,'One friend → <b>is</b>.','🧒👦','😂🎒','Best friends!'],['🟢 Choose the correct form','We ___ in Year 5.',['is','am','are'],2,'We use <b>are</b> with <b>we</b>.','👧🧒👦','📚5️⃣','Year 5!'],['🟢 Choose the correct form','Tom and Ben ___ at school.',['are','is','am'],0,'Tom and Ben = <b>they</b>, so we use <b>are</b>.','👦👦','🎒🏫','Tom + Ben'],['🚫 Make it negative','Kate is happy. Choose the correct negative sentence.',['Kate not is happy.','Kate isn\'t happy.','Kate aren\'t happy.'],1,'<b>is not = isn\'t</b>.','👧','🙂➡️🙁','Kate'],['🚫 Make it negative','We are late. Choose the negative sentence.',['We aren\'t late.','We isn\'t late.','We not are late.'],0,'<b>are not = aren\'t</b>.','🧒👧','⏰🏃','Hurry!'],['🚫 Make it negative','Choose the correct sentence.',['I amn\'t tired.','I not am tired.','I\'m not tired.'],2,'With <b>I am</b>: <b>I\'m not</b>.','🧒','😴☕','Not tired!'],['❓ Question Detective','Choose the correct question.',['You are twelve?','Are you twelve?','Is you twelve?'],1,'In a question, <b>are</b> comes before <b>you</b>.','👧','🎂1️⃣2️⃣','How old?'],['❓ Question Detective','Which question is correct?',['Is your teacher nice?','Are your teacher nice?','Your teacher is nice?'],0,'One teacher → the question begins with <b>Is</b>.','👩‍🏫','🍎📚','Your teacher'],['❓ Question Detective','Choose the correct question.',['Is they at school?','They are at school?','Are they at school?'],2,'With <b>they</b> we use <b>are</b>.','👧👦','🏫❓','Where are they?'],['⚡ Short answers','Are you a student?',['Yes, I am.','Yes, I is.','Yes, I\'m.'],0,'The short answer is <b>Yes, I am.</b>','🧑‍🎓','📚✏️','Yes!'],['⚡ Short answers','Is Tom at home? — No, ___.',['he aren\'t','he isn\'t','he not'],1,'<i>Is Tom...?</i> → <b>No, he isn\'t.</b>','👦','🏠❌','Tom?'],['🔧 Fix the mistake','I is a good student. Choose the correct sentence.',['I are a good student.','I am a good student.','I be a good student.'],1,'<b>I</b> always goes with <b>am</b>.','🧑‍🎓','🏆📖','Great student!'],['🔧 Fix the mistake','Are she your sister? Choose the correct version.',['Is she your sister?','Am she your sister?','She are your sister?'],0,'We use <b>is</b> with <b>she</b>.','👧👧','💜❓','Sisters?'],['🏆 Final Challenge','Which sentence is completely correct?',['They isn\'t new students.','Are your friends from Russia?','Is you good at English?'],1,'<b>Friends = they</b>, so <i>Are your friends from Russia?</i> is correct.','👧🧒👦','🌍🇷🇺','FINAL!']];let i=0,s=0,done=false;const $=x=>document.getElementById(x);function load(){done=false;let x=qs[i];$('round').innerHTML=x[0];$('q').innerHTML=(i+1)+'. '+x[1];$('people').textContent=x[5];$('props').textContent=x[6];$('bubble').textContent=x[7];$('count').textContent=`Question ${i+1} / ${qs.length}`;$('bar').style.width=`${i/qs.length*100}%`;$('answers').innerHTML='';$('feedback').style.display='none';$('next').style.display='none';x[2].forEach((a,n)=>{let b=document.createElement('button');b.className='ans';b.innerHTML=`<b>${String.fromCharCode(65+n)})</b> ${a}`;b.onclick=()=>choose(n,b);$('answers').appendChild(b)})}function choose(n,b){if(done)return;done=true;let x=qs[i],bs=document.querySelectorAll('.ans');bs.forEach(z=>z.disabled=true);bs[x[3]].classList.add('correct');let f=$('feedback');if(n===x[3]){s++;$('score').textContent=s;f.className='feedback good';f.innerHTML='🎉 <b>Correct!</b><br>'+x[4]}else{b.classList.add('wrong');f.className='feedback bad';f.innerHTML=`💡 <b>Not quite.</b><br>The correct answer is <b>${x[2][x[3]]}</b>.<br>${x[4]}`}f.style.display='block';$('next').style.display='block';$('next').textContent=i===qs.length-1?'See my result 🏆':'Next question →'}$('next').onclick=()=>{i++;i<qs.length?load():finish()};function finish(){$('quiz').style.display='none';$('result').style.display='block';let p=Math.round(s/qs.length*100),e,t,m,st;if(p>=90){e='🏆🎉';t='TO BE Champion!';st='⭐⭐⭐⭐⭐';m='Amazing work! You are a TO BE superstar!'}else if(p>=70){e='🌟';t='Grammar Star!';st='⭐⭐⭐⭐';m='Great job! Check the questions you missed and try once more!'}else if(p>=50){e='👍';t='Good job!';st='⭐⭐⭐';m='You’re making good progress. Play again and beat your score!'}else{e='🚀';t='Keep going!';st='⭐⭐';m='Remember: <b>I am • he/she/it is • you/we/they are</b>.'}$('emoji').textContent=e;$('title').textContent=t;$('final').textContent=`${s} / ${qs.length} • ${p}%`;$('stars').textContent=st;$('message').innerHTML=m;$('restart').style.display='block'}$('restart').onclick=()=>{i=0;s=0;$('score').textContent=0;$('result').style.display='none';$('quiz').style.display='block';load()};load();</script></body></html>
