<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Флеш-карты — A E O U</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Comic Sans MS",cursive;color:#403858;background:linear-gradient(135deg,#fff5fc,#eee8ff 45%,#dcf5ff);display:flex;justify-content:center}.app{width:100%;max-width:650px;padding:22px 16px;text-align:center}h1{color:#6951bd;margin:5px}.sub{color:#766d8e}.prog{height:13px;background:#fff;border-radius:20px;overflow:hidden;margin:15px}.bar{height:100%;background:linear-gradient(90deg,#a68bff,#ff8fc7);transition:.4s}.count{font-weight:bold}.area{perspective:1200px;height:365px;margin-top:14px}.card{height:100%;position:relative;transform-style:preserve-3d;transition:.7s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.side{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;border:4px solid #ffffffcc;box-shadow:0 16px 35px #46326e2e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}.front{background:linear-gradient(145deg,#f2ecff,#e3d8ff)}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#e6f8ff,#cbefff)}.icon{font-size:45px}.word{font-size:68px;font-weight:bold;color:#6550ad;margin:16px}.v{color:#e44f91;text-decoration:underline}.ipa{font:700 42px Arial;color:#277ca7}.tr{font-size:30px;font-weight:bold;margin:9px}.rule{background:#ffffffa8;padding:12px;border-radius:16px;font-size:18px;line-height:1.35}.controls{min-height:125px;padding:20px}.answers{display:none;gap:14px;justify-content:center}.answers.show{display:flex}.next{display:none;margin:15px auto}.next.show{display:block}button{border:0;border-radius:18px;padding:13px 22px;font:700 18px "Comic Sans MS",cursive;cursor:pointer;box-shadow:0 7px 14px #46326421}.no{background:#ffd9e8;color:#a34270}.yes{background:#c9f4df;color:#287e59}.next,.restart{background:linear-gradient(135deg,#9d83ef,#8065d4);color:#fff}.result{display:none;background:#ffffffd9;padding:35px 22px;border-radius:30px;box-shadow:0 17px 40px #46326e2e}.result.show{display:block}.stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}.star{position:absolute;animation:fly 2.7s ease-out forwards}@keyframes fly{0%{opacity:0;transform:scale(.2)}20%{opacity:.8}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(320deg)}}@media(max-width:600px){.area{height:345px}.word{font-size:55px}.answers button{font-size:16px;padding:12px}.rule{font-size:16px}}</style></head><body><div class="stars" id="stars"></div><main class="app"><h1>📖 Флеш-карты ✨</h1><div class="sub">Чтение: A • E • O • U — открытый и закрытый слог</div><div id="progress"><div class="count" id="count"></div><div class="prog"><div class="bar" id="bar"></div></div></div><section id="game"><div class="area"><div class="card" id="card"><div class="side front"><div class="icon" id="i1"></div><div>Прочитай слово вслух:</div><div class="word" id="word"></div><div>✨ Нажми на карточку, чтобы проверить себя</div></div><div class="side back"><div class="icon" id="i2"></div><div class="ipa" id="ipa"></div><div class="tr" id="tr"></div><div class="rule" id="rule"></div></div></div></div><div class="controls"><div class="answers" id="answers"><button class="no" onclick="answer(false)">🤔 Не знаю</button><button class="yes" onclick="answer(true)">🌟 Знаю!</button></div><button class="next" id="next" onclick="nextCard()">Следующий вопрос ➜</button></div></section><section class="result" id="result"><div style="font-size:65px" id="ri">👑</div><h2>Готово!</h2><div id="score" style="font-size:26px"></div><p id="feedback" style="font-size:19px;line-height:1.5"></p><button class="restart" onclick="restart()">🔄 Начать заново</button></section></main><script>
const C=[["cat","c<span class='v'>a</span>t","/kæt/","кот","A в закрытом слоге обычно читается как <b>/æ/</b>.","🐱"],["name","n<span class='v'>a</span>me","/neɪm/","имя","В модели <b>a + согласная + e</b> буква A читается <b>/eɪ/</b>.","✨"],["map","m<span class='v'>a</span>p","/mæp/","карта","В закрытом слоге A обычно даёт короткий звук <b>/æ/</b>.","🗺️"],["game","g<span class='v'>a</span>me","/ɡeɪm/","игра","Немая e помогает A читаться как <b>/eɪ/</b>.","🎮"],["pet","p<span class='v'>e</span>t","/pet/","питомец","E в закрытом слоге обычно читается <b>/e/</b>.","🐶"],["pen","p<span class='v'>e</span>n","/pen/","ручка","E в закрытом слоге обычно читается <b>/e/</b>.","🖊️"],["he","h<span class='v'>e</span>","/hiː/","он","В открытом слоге E читается долгим звуком <b>/iː/</b>.","👦"],["me","m<span class='v'>e</span>","/miː/","меня / мне","В открытом слоге E читается как <b>/iː/</b>.","🙋"],["dog","d<span class='v'>o</span>g","/dɒɡ/","собака","В британском английском O в закрытом слоге часто читается <b>/ɒ/</b>.","🐕"],["box","b<span class='v'>o</span>x","/bɒks/","коробка","В закрытом слоге O обычно читается <b>/ɒ/</b>.","📦"],["home","h<span class='v'>o</span>me","/həʊm/","дом","В модели <b>o + согласная + e</b> O читается <b>/əʊ/</b>.","🏠"],["rose","r<span class='v'>o</span>se","/rəʊz/","роза","Немая e помогает O читаться как <b>/əʊ/</b>.","🌹"],["bus","b<span class='v'>u</span>s","/bʌs/","автобус","U в закрытом слоге часто читается <b>/ʌ/</b>.","🚌"],["sun","s<span class='v'>u</span>n","/sʌn/","солнце","U в закрытом слоге обычно читается как <b>/ʌ/</b>.","☀️"],["cute","c<span class='v'>u</span>te","/kjuːt/","милый","В модели <b>u + согласная + e</b> U читается <b>/juː/</b>.","🦄"],["tube","t<span class='v'>u</span>be","/tjuːb/","тюбик / трубка","В британском английском U здесь читается <b>/juː/</b>.","🎨"]];
let n=0,k=0,done=false,fl=false;const $=id=>document.getElementById(id);function load(){let x=C[n];$("word").innerHTML=x[1];$("ipa").textContent=x[2];$("tr").textContent=x[3];$("rule").innerHTML=x[4];$("i1").textContent=$("i2").textContent=x[5];$("count").textContent="Карточка "+(n+1)+" из "+C.length;$("bar").style.width=(n/C.length*100)+"%";$("card").classList.remove("flip");$("answers").classList.remove("show");$("next").classList.remove("show");done=fl=false}$("card").onclick=()=>{if(!done&&!fl){$("card").classList.add("flip");$("answers").classList.add("show");fl=true}};function answer(v){if(done)return;done=true;if(v)k++;$("answers").classList.remove("show");$("next").classList.add("show");$("next").textContent=n===C.length-1?"Посмотреть результат 👑":"Следующий вопрос ➜"}function nextCard(){if(!done)return;if(++n<C.length)load();else finish()}function finish(){$("game").style.display=$("progress").style.display="none";$("result").classList.add("show");$("score").innerHTML="Ты прочитал правильно <b>"+k+" из "+C.length+"</b> слов!";let f=k===16?"Великолепно! Ты настоящий мастер чтения! Так держать! 🌟":k>=13?"Отличная работа! Ты очень хорошо различаешь открытые и закрытые слоги. ✨":k>=9?"Здорово! Повтори сложные слова — и результат станет ещё лучше! 💫":k>=5?"Хорошее начало! Немного практики — и читать станет намного легче! 🌟":"Ты только начинаешь — и это отлично! Пройди карточки ещё раз. У тебя обязательно получится! ✨";$("feedback").textContent=f;for(let j=0;j<55;j++){let s=document.createElement("span");s.className="star";s.textContent=["⭐","✨","✦","🌟","💫"][Math.floor(Math.random()*5)];s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.setProperty("--x",(Math.random()-.5)*350+"px");s.style.setProperty("--y",(Math.random()-.5)*350+"px");s.style.animationDelay=Math.random()*1.3+"s";$("stars").appendChild(s)}}function restart(){n=k=0;$("stars").innerHTML="";$("result").classList.remove("show");$("game").style.display="block";$("progress").style.display="block";load()}load();</script></body></html>
